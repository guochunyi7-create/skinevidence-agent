#   是行业经验参考值，不是法规限量，也不是可直接投产的生产指令。
#   实际配方须结合具体原料规格、工艺条件、稳定性/安全性/功效评价，
#   由研发与法规人员复核确认后方可使用。evidence=msds 表示该项目已收录该原料 MSDS，
#   可在知识库中检索到原始安全资料；evidence=industry 表示仅有行业常规用法参考。
#
# 由配方/法规团队维护；新增原料按下方格式追加即可，引擎无需改动。

