# 中英成分术语表
# 用途一：查询扩展 —— 中文提问（"甘油安全吗"）补上英文名（Glycerine）再检索英文 MSDS
# 用途二：入库注入 —— 把中文名写进该原料所有切块的表头，让中文查询能字面命中
#
# CAS 号仅作检索辅助；对外表述与备案核对一律以官方文件和厂家 MSDS 原件为准。
# 由配方/法规团队维护，新增原料只需在此追加一条。

version: 1

