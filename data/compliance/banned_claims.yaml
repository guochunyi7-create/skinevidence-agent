# 化妆品宣称禁用词库
# level: block = 命中即禁止对外输出，转人工；rewrite = 删除命中句并降级表述；review = 标记人工复核
# terms 一律使用正则（Python re），便于表达上下文限定，避免"最"误伤"最近"

version: 1

categories:
  medical:
    level: block
    desc: 医疗作用宣称，《化妆品监督管理条例》明令禁止
    terms:
      - "治疗"
      - "治愈"
      - "根治"
      - "消炎"
      - "抗炎"
      - "药效"
      - "处方"
      - "医美级"
      - "药用"
      - "替代药物"

  disease:
    level: block
    desc: 涉及疾病诊断与治疗，超出化妆品经营范围
    terms:
      - "痤疮"
      - "湿疹"
      - "皮炎"
      - "激素脸"
      - "毛囊炎"
      - "玫瑰痤疮"

  absolute:
    level: rewrite
    desc: 绝对化用语，违反广告法第九条
    terms:
      - "最(好|强|有效|安全|先进)"
      - "第一品牌"
      - "全网第一"
      - "唯一"
      - "国家级"
      - "100%\\s*有效"
      - "纯天然"
      - "无添加"
      - "零添加"
      - "永久"

  special_cosmetic:
    level: info
    desc: 特殊化妆品功效，须核对注册证号后方可对外表述（仅标记，不阻断，不转人工）
    terms:
      - "防晒"
      - "美白"
      - "祛斑"
      - "染发"
      - "烫发"
      - "防脱"

sensitive_topics:
  pregnancy:
    desc: 孕期 / 哺乳期人群，必须提示咨询医生并转人工
    terms:
      - "孕妇"
      - "怀孕"
      - "哺乳期"
      - "备孕"

  children:
    desc: 儿童化妆品，须提示小金盾标识与成人监护
    terms:
      - "儿童"
      - "宝宝"
      - "婴儿"
      - "小朋友"

  allergy:
    desc: 过敏体质 / 敏感肌，须提示局部测试
    terms:
      - "过敏"
      - "敏感肌"
      - "红血丝"
      - "烂脸"
